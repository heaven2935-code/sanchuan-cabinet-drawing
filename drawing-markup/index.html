<html lang="zh-Hant">
<head>

<title>三川工方｜繪圖與標記 V1.1</title>
<style>
:root{--night:#222c34;--night2:#303d47;--night3:#40515e;--clay:#a65c45;--lightclay:#eab39f;--paper:#fbfaf7;--cream:#eeeae4;--ink:#26313a;--muted:#6c7780;--aqua:#387b77;--line:#d4d9d8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}input,select,textarea{min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #76b8b0;outline-offset:0}
#app{height:100vh;height:100dvh;height:var(--real-height,100dvh);width:100vw;display:flex;flex-direction:column;overflow:hidden}.top{height:50px;min-height:50px;display:flex;align-items:center;gap:8px;padding:4px max(10px,env(safe-area-inset-right)) 4px max(10px,env(safe-area-inset-left));background:var(--night);color:#f6f3ef;border-bottom:1px solid #4a5158}.logo{width:33px;height:33px;border:2px solid #d58c71;border-radius:8px;display:grid;place-items:center;flex:none;font-weight:900;color:#d8a18d}.brand{line-height:1.12;min-width:122px}.brand b{display:block;font-size:13px;letter-spacing:2px}.brand small{color:#b2bcc0;font-size:9px}.project{height:32px;width:178px;max-width:22vw;border:1px solid #6c7b82;background:#35434d;color:#fff;border-radius:6px;padding:5px 9px;font-size:12px}.grow{flex:1}.btn{border:1px solid #687780;color:#f8f5f1;background:#35434e;border-radius:7px;padding:6px 10px;white-space:nowrap;font-size:12px;min-height:34px}.btn.primary{background:var(--clay);border-color:#ca8066}.btn.active{background:#506c73}.main{display:grid;grid-template-columns:72px minmax(0,1fr) 290px;flex:1;min-height:0}.tools{background:var(--night2);display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;gap:4px;padding:7px 4px calc(10px + env(safe-area-inset-bottom));scrollbar-width:thin}.tool{flex:none;width:63px;min-height:53px;border-radius:8px;border:1px solid transparent;background:transparent;color:#dce4e5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;padding:5px 1px;font-size:11px}.tool .ic{font-size:21px;line-height:1;font-family:system-ui}.tool.active{color:#f5c6b2;background:#ae674b30;border-color:#d18b70}.tool:hover{background:#44525c}.tool-rule{height:1px;width:48px;background:#5d6a70;margin:4px}.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--cream)}.bar{height:41px;min-height:41px;background:#f0ece6;border-bottom:1px solid #ccc6bf;display:flex;align-items:center;gap:6px;padding:4px 9px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}.pill{font-size:11px;background:white;border:1px solid #c8c6c1;color:#555d62;border-radius:6px;padding:6px 9px;min-height:30px}.pill.active{border-color:#c7836a;color:#9c4a36;background:#fff1ea}.pill strong{font-size:12px}.stage{position:relative;flex:1;min-height:0;background:var(--paper);overflow:hidden}#sheet{display:block;width:100%;height:100%;touch-action:none;user-select:none;cursor:crosshair}.hint{position:absolute;top:10px;left:10px;border-radius:7px;padding:7px 10px;background:#fffffff2;border:1px solid #dad5cb;max-width:min(420px,75%);font-size:11px;color:#626c6c;pointer-events:none;box-shadow:0 2px 14px #00000010}.hint b{color:#9d5b47}.hud{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;gap:8px}.coords{color:#f3f8f7;font-size:11px;line-height:1.6;background:#293a44e8;border-radius:7px;padding:5px 9px;font-variant-numeric:tabular-nums}.zoom{pointer-events:auto;border:1px solid #d8d0c4;background:#fffffff2;padding:3px;border-radius:7px;display:flex;align-items:center;gap:4px}.zoom button{width:32px;height:30px;border:0;border-radius:5px;background:#e8e3dc;color:#333;font-size:19px}.zoom span{min-width:43px;text-align:center;font-size:11px;color:#555}.foot{height:25px;min-height:25px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px;color:#64716f;background:#eeece8;border-top:1px solid #d6d3cb;font-size:10px;overflow:hidden}.foot span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.side{background:#f7f5f1;border-left:1px solid #cfd5d4;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px;scrollbar-width:thin}.section{border:1px solid #d8d7d0;background:white;border-radius:10px;padding:11px;margin-bottom:10px;box-shadow:0 1px 8px #00000008}.section h3{margin:0 0 10px;color:#34444c;font-size:13px;display:flex;justify-content:space-between;align-items:center}.section h3 small{font-size:10px;color:#78827e;font-weight:400}.row{display:flex;align-items:center;gap:7px;margin-bottom:8px}.row:last-child{margin-bottom:0}.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;color:#697678;font-size:11px}.field input,.field select,.field textarea{width:100%;min-height:31px;border:1px solid #cfd5d2;background:#fafafa;border-radius:6px;padding:4px 6px;color:#22343e;font-size:13px}.field input[type=color]{padding:2px;min-height:32px;max-width:60px}.field textarea{resize:vertical;min-height:45px}.tiny{color:#6b7b7a;font-size:10px;line-height:1.55}.action{background:#3c7774;color:white;border:0;border-radius:7px;padding:8px 9px;font-size:12px;min-height:34px}.action.ghost{background:#e9efec;color:#396864}.action.warn{background:#fff0e9;color:#9b4b36}.action.dark{background:#34434b}.action:disabled{opacity:.35}.wide{width:100%}.unit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.unit-grid button{padding:7px 2px;border:1px solid #d0d5d3;border-radius:6px;background:#f8f8f6;color:#526363;font-size:11px}.unit-grid button.sel{background:#dcf0eb;border-color:#76a59b;color:#225850;font-weight:700}.nudge{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,35px);gap:4px;max-width:190px;margin:8px auto}.nudge button{background:#eaf1ee;border:1px solid #cadcd7;border-radius:7px;font-size:17px;color:#345d56}.nudge .middle{font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;background:#f7f6f1}.nudge .empty{visibility:hidden}.point-tabs{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.point-tabs button{border:1px solid #cdd5d2;border-radius:6px;background:#f7f8f6;color:#4a5b5a;padding:5px 9px;font-size:11px}.point-tabs button.active{background:#347e79;color:white}.dial-wrap{display:flex;align-items:center;gap:8px;justify-content:center}.dial{width:110px;height:110px;touch-action:none;cursor:crosshair;flex:none}.angle-details{flex:1;min-width:0}.angle-details input{width:100%}.swatch{height:28px;min-width:28px;border-radius:5px;border:2px solid #fff;box-shadow:0 0 0 1px #aaa}.layers{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto}.layer{display:flex;align-items:center;gap:5px;border:1px solid #e0e2de;border-radius:6px;padding:5px;background:#fafbf9;font-size:11px;cursor:pointer}.layer.active{border-color:#4b8e84;background:#eaf4f0}.layer .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer button{border:0;background:transparent;padding:3px;min-width:23px;color:#475963}.hidden{display:none!important}#app.focus .side{display:none}#app.focus .main{grid-template-columns:72px minmax(0,1fr)}#app.focus .top .brand,#app.focus .top .project{display:none}#app.focus .top{height:42px;min-height:42px}#toast{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);background:#273d42;color:white;padding:9px 15px;border-radius:8px;font-size:12px;max-width:70%;pointer-events:none;opacity:0;transition:opacity .2s;z-index:15}#toast.show{opacity:1}.context{position:absolute;right:12px;top:10px;background:#273a42df;color:white;border-radius:7px;font-size:11px;padding:7px 9px;pointer-events:none}
@media(max-width:900px){.main{grid-template-columns:62px minmax(0,1fr) 235px}.tool{width:56px;min-height:47px}.tools{padding:5px 3px}.side{padding:7px}.section{padding:8px}.brand{min-width:105px}.brand b{letter-spacing:0;font-size:12px}.project{width:110px}.top{gap:5px}.btn{padding:5px 7px;font-size:11px}#app.focus .main{grid-template-columns:62px minmax(0,1fr)}}
@media(max-width:650px){.main{grid-template-columns:53px minmax(0,1fr)}.tools{padding:4px 1px}.tool{width:48px;min-height:44px;font-size:10px}.side{position:absolute;z-index:10;right:0;top:50px;bottom:0;width:min(300px,84vw);box-shadow:-5px 0 25px #0002}.side.closed{display:none}.brand{display:none}.project{max-width:30vw}.top{height:46px;min-height:46px}#app.focus .main{grid-template-columns:53px minmax(0,1fr)}}

/* v1.1: free the canvas on portrait and landscape. All properties are on-demand. */
.main{grid-template-columns:61px minmax(0,1fr);position:relative}
.tools{padding:6px 2px}.tool{width:55px;min-height:49px}.center{position:relative}
.side{position:absolute;z-index:31;right:0;top:0;bottom:0;width:min(360px,92vw);box-shadow:-5px 0 25px #0b161e35;border-radius:12px 0 0 12px}
.side.closed{display:none}.side::before{content:'屬性設定';display:block;font-size:13px;font-weight:700;color:#2d4a4b;margin:0 0 12px}
.bar{height:45px;min-height:45px;gap:4px;padding:4px 6px}.pill{padding:5px 8px;min-height:33px}.quick-btn{min-width:34px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:600}
.quick-btn .dot{width:16px;height:16px;border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #a1a6a3}
#widthPreview{display:inline-block;width:22px;background:var(--clay);height:3px;border-radius:3px}
.tool-picker{position:absolute;z-index:35;left:5px;top:6px;width:min(258px,90%);max-height:min(360px,70%);overflow:auto;border:1px solid #bccac8;background:#fffffff9;border-radius:11px;box-shadow:0 10px 30px #27343b45;padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tool-picker button{border:1px solid #d7dad8;border-radius:8px;min-height:42px;background:#f6f7f5;color:#30494d;font-weight:600;font-size:13px}
.tool-picker button.sel{border-color:#aa6954;background:#fff1ea;color:#994b36}
.tool-picker-title{grid-column:1/-1;font-weight:700;color:#485957;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.tool-picker-title button{min-height:25px;font-size:18px;border:0;background:transparent;padding:0 7px}
.quick-panel{position:absolute;z-index:36;top:49px;left:6px;width:min(275px,90%);background:#fffffff9;box-shadow:0 7px 25px #1a343f45;border:1px solid #c9d1cc;border-radius:9px;padding:12px;font-size:13px}
.quick-panel .row{margin:9px 0}.quick-panel .field{font-size:12px}.quick-panel button{border:1px solid #c9d4cf;border-radius:7px;padding:7px;background:#edf4f0;color:#235851}
.quick-panel h3{font-size:13px;color:#314447;margin:0;display:flex;justify-content:space-between;align-items:center}
.quick-panel h3 button{background:none;border:none;padding:1px 4px;font-size:22px}
.point-nudge{position:absolute;z-index:24;width:126px;height:126px;pointer-events:none;display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);filter:drop-shadow(0 2px 6px #1115)}
.point-nudge button{pointer-events:auto;border:1px solid #6e9993;background:#e7f6f1ec;color:#226056;font-size:20px;font-weight:700;min-width:0;min-height:0;border-radius:8px;touch-action:manipulation}
.point-nudge .core{pointer-events:auto;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fffefbec;border:1px solid #a3c5bb;border-radius:30px;font-size:11px;line-height:1.2;color:#326359;cursor:pointer}
.point-nudge .core b{font-size:13px}
.point-nudge .blank{visibility:hidden}
.guides-guide{stroke:#2778aa;stroke-width:1.2;stroke-dasharray:9 7;vector-effect:non-scaling-stroke;opacity:.72;pointer-events:none}
@media(max-width:900px){.main{grid-template-columns:55px minmax(0,1fr)}.tool{width:49px;min-height:48px}#app.focus .main{grid-template-columns:55px minmax(0,1fr)}}
@media(max-width:650px){.main{grid-template-columns:52px minmax(0,1fr)}.tools{padding:3px 1px}.tool{width:49px;min-height:47px}#app.focus .main{grid-template-columns:52px minmax(0,1fr)}.side{position:absolute;z-index:31;top:auto;left:52px;right:0;bottom:0;height:min(60dvh,500px);width:auto;max-height:60dvh;border-radius:14px 14px 0 0;box-shadow:0 -5px 24px #1a293c40}.project{max-width:23vw}.btn{padding:5px 6px}.point-nudge{width:114px;height:114px;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px)}}
@media(max-width:420px){.top{gap:3px}.top .project{width:78px;max-width:78px}.top .btn{font-size:11px;padding:5px}.bar{gap:3px}.pill{font-size:11px;padding:4px 5px}}

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">川</div><div class="brand"><b>三川工方</b><small>繪圖與標記 V1.1</small></div>
    <input id="filename" class="project" value="未命名圖面" aria-label="圖檔名稱">
    <div class="grow"></div>
    <button class="btn" id="undo" title="復原">↶ 復原</button><button class="btn" id="redo" title="重做">↷ 重做</button>
    <button class="btn" id="fit" title="適合畫布">適屏</button><button class="btn" id="focus" title="隱藏設定面板">⛶ 滿版</button>
    <button class="btn" id="toggleSide">屬性</button><button class="btn primary" id="share">↗ 分享</button>
  </header>
  <main class="main">
    <nav class="tools" id="tools">
      <button class="tool active" data-tool="select"><span class="ic">⌖</span>選取</button>
      <button class="tool" data-tool="pan"><span class="ic">✥</span>平移</button>
      <div class="tool-rule"></div>
      <button class="tool" data-menu="lines"><span class="ic">╱</span>線條 ▾</button>
      <button class="tool" data-menu="curves"><span class="ic">◯</span>圓弧 ▾</button>
      <button class="tool" data-menu="triangles"><span class="ic">△</span>三角形 ▾</button>
      <button class="tool" data-menu="polygons"><span class="ic">⬡</span>多角形 ▾</button>
      <div class="tool-rule"></div>
      <button class="tool" data-tool="pen"><span class="ic">✎</span>畫筆</button>
      <button class="tool" data-tool="text"><span class="ic">文</span>文字</button>
    </nav>
    <div class="center">
      <div class="bar">
        <button class="pill quick-btn" id="openColor" title="線條顏色"><span class="dot" id="colorDot" style="background:#a65c45"></span>顏色</button>
        <button class="pill quick-btn" id="openWidth" title="線條粗細"><span id="widthPreview"></span><span id="widthLabel">2px</span></button>
        <button class="pill quick-btn" id="openUnit" title="繪圖單位"><span id="unitLabel">mm ▾</span></button>
        <button class="pill active" id="grid" title="顯示格線">格線✓</button>
        <button class="pill" id="guideH" title="水平輔助線">水平</button>
        <button class="pill" id="guideV" title="垂直輔助線">垂直</button>
        <button class="pill active" id="snap">吸附✓</button>
        <button class="pill active" id="angleSnap">角吸✓</button>
        <button class="pill" id="endCont" style="display:none">結束連續線</button><button class="pill" id="delete" style="color:#a45143">刪除</button>
        <div class="grow"></div><button class="pill" id="bgBtn">照片</button><button class="pill" id="exportMenu">匯出</button>
        <input type="file" id="bgInput" accept="image/*" class="hidden"><input type="file" id="importInput" accept=".json,application/json" class="hidden">
      </div>
      <div id="toolPicker" class="tool-picker hidden" role="menu"></div>
      <div id="quickPanel" class="quick-panel hidden"></div>
      <div class="stage" id="stage">
        <svg id="sheet" xmlns="http://www.w3.org/2000/svg" aria-label="可觸控編輯的繪圖畫布"><defs>
            <pattern id="minorGrid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 L 0 0 0 50" fill="none" stroke="#dfebe8" stroke-width="1"/></pattern>
            <pattern id="majorGrid" width="250" height="250" patternUnits="userSpaceOnUse"><rect width="250" height="250" fill="url(#minorGrid)"/><path d="M 250 0 L 0 0 0 250" fill="none" stroke="#bfcfca" stroke-width="2"/></pattern>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
          </defs><rect id="paper" fill="#fffefb"/><rect id="gridBg" fill="url(#majorGrid)" pointer-events="none"/><g id="background"></g><g id="guides"></g><g id="art"></g><g id="preview"></g><g id="handles"></g></svg>
        <div class="hint" id="hint"><b>選取</b> 點線段或端點可再編輯；端點微調鍵會在附近出現</div><div id="modeTip" class="context hidden"></div>
        <div id="pointNudge" class="point-nudge hidden"></div><div class="hud"><div class="coords" id="coords">X 0　Y 0 mm</div><div class="zoom"><button id="zoomOut">−</button><span id="zoomText">100%</span><button id="zoomIn">＋</button></div></div><div id="toast"></div>
      </div>
      <div class="foot"><span id="status">準備完成｜選擇左側工具開始繪圖</span><span id="statusSave">自動保存至此瀏覽器</span></div>
    </div>
    <aside class="side closed" id="side"><div id="inspector"></div></aside>
  </main>
</div>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), svg=$('sheet');
const MM={mm:1,cm:10,chi:303}, names={mm:'公釐',cm:'公分',chi:'台尺'};
const tools={select:'選取',pan:'平移',line:'直線',continuous:'連續線',dashed:'虛線',arrow:'箭頭',dimension:'尺寸線',circle:'圓形',semi:'半圓',quarter:'四分之一圓',ellipse:'橢圓',triangle:'一般三角形',rightTriangle:'直角三角形',isoTriangle:'等腰三角形',polygon:'正多角形',pen:'畫筆',text:'文字'};
const categories={lines:[['line','直線'],['continuous','連續直線'],['dashed','虛線'],['arrow','箭頭'],['dimension','尺寸標記']],curves:[['circle','圓形'],['semi','半圓'],['quarter','四分之一圓'],['ellipse','橢圓']],triangles:[['triangle','一般三角形'],['rightTriangle','直角三角形'],['isoTriangle','等腰三角形']],polygons:[['polygon','正五角形',5],['polygon','正六角形',6],['polygon','正七角形',7],['polygon','正八角形',8]]};
const groupNames={lines:'線條種類',curves:'圓形與橢圓',triangles:'三角形',polygons:'正多角形'};
let activeMenu=null;
const defaults={tool:'select',unit:'mm',pen:'#a65c45',width:2,grid:true,snap:true,step:1,len:600,angle:0,minor:300,triSecond:450,triAngle:65,sides:6,guideH:false,guideV:false,angleSnap:true,font:'sans',fontSize:36,bold:false,text:'文字標記',side:false};
const state={...defaults,items:[],bg:null,selected:null,point:1,anchor:null,cursor:{x:0,y:0},view:{cx:1200,cy:750,scale:0.27},pending:null,preview:null,gesture:null,project:'未命名圖面'};
const undo=[],redo=[];let seq=Date.now(),toastTimer=null,autosaveTimer=null,lastView={},vWidth=1,vHeight=1;
const fmtNum=n=>Number(Number(n).toFixed(3));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const toUnit=v=>fmtNum(v/MM[state.unit]);const toMM=v=>Number(v||0)*MM[state.unit];
const display=v=>`${toUnit(v)} ${names[state.unit]}`;
const status=s=>$('status').textContent=s;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function snapshot(){return JSON.stringify({items:state.items,bg:state.bg,project:state.project})}
function checkpoint(){undo.push(snapshot());if(undo.length>80)undo.shift();redo.length=0}
function applySnapshot(s){try{const x=JSON.parse(s);state.items=x.items||[];state.bg=x.bg||null;state.project=x.project||'未命名圖面';state.selected=null;state.anchor=null;$('filename').value=state.project;render();store()}catch(e){toast('無法還原')} }
function undoIt(){if(!undo.length){toast('沒有可復原動作');return}redo.push(snapshot());applySnapshot(undo.pop());toast('已復原')}

function nudgeHTML(){return `<div class="nudge"><span class="empty"></span><button data-nudge="up">↑</button><span class="empty"></span><button data-nudge="left">←</button><div class="middle">●<small>${state.step} mm</small></div><button data-nudge="right">→</button><span class="empty"></span><button data-nudge="down">↓</button><span class="empty"></span></div>`}
function addItem(item){checkpoint();state.items.push(item);state.selected=item.id;state.point=Math.max(0,item.points.length-1);state.preview=null;render();store();status(`已新增${tools[item.type]||item.type}`)}
function nudge(dir){let d=({up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]})[dir];if(!d)return;const s=current();checkpoint();const before=s?clone(s.points):null;const p=s?s.points[Math.min(state.point,s.points.length-1)]:state.cursor;p.x=fmtNum(p.x+d[0]*state.step);p.y=fmtNum(p.y+d[1]*state.step);if(s){fixNamedTriangle(s,state.point,before);status(`點 ${String.fromCharCode(65+state.point)} 精準微調 ${state.step} mm`)}else updateCursor(p);render();store()}
function setPoint(i){const s=current();if(!s)return;state.point=Math.max(0,Math.min(s.points.length-1,i));updateCursor(s.points[state.point]);render()}
function fixNamedTriangle(s,index,old){
 if(!['rightTriangle','isoTriangle'].includes(s.type)||!old||old.length<3)return;
 const [a,b,c]=s.points;
 if(index===0){const dx=a.x-old[0].x,dy=a.y-old[0].y;for(let k=1;k<3;k++){s.points[k].x=fmtNum(old[k].x+dx);s.points[k].y=fmtNum(old[k].y+dy)}return}
 const angleAB=Math.atan2(b.y-a.y,b.x-a.x);
 if(s.type==='rightTriangle'){
   const ori=(old[1].x-old[0].x)*(old[2].y-old[0].y)-(old[1].y-old[0].y)*(old[2].x-old[0].x);
   const side=ori<0?-1:1,length=index===2?Math.max(1,distance(a,c)):Math.max(1,distance(old[0],old[2]));
   const rad=angleAB+side*Math.PI/2;c.x=fmtNum(a.x+length*Math.cos(rad));c.y=fmtNum(a.y+length*Math.sin(rad));
 } else {
   if(index===1){const len=Math.max(1,distance(a,b)),rad=Math.atan2(old[2].y-a.y,old[2].x-a.x);c.x=fmtNum(a.x+len*Math.cos(rad));c.y=fmtNum(a.y+len*Math.sin(rad))}
   else {const len=Math.max(1,distance(a,c)),rad=Math.atan2(old[1].y-a.y,old[1].x-a.x);b.x=fmtNum(a.x+len*Math.cos(rad));b.y=fmtNum(a.y+len*Math.sin(rad))}
 }
}
function moveShape(s,dx,dy){s.points.forEach(p=>{p.x=fmtNum(p.x+dx);p.y=fmtNum(p.y+dy)})}
function lineFrom(anchor,len,angle){const rad=angle*Math.PI/180;return [{...anchor},{x:fmtNum(anchor.x+len*Math.cos(rad)),y:fmtNum(anchor.y+len*Math.sin(rad))}]}
function addByNumber(dir){if(dir){state.angle=({right:0,down:90,left:180,up:270})[dir]}const len=Math.max(.001,state.len);let a=state.tool==='continuous'?state.anchor:null;
if(!a){const selected=current();a=selected?.points?.[Math.min(state.point,selected.points.length-1)]||state.cursor}
const pp=lineFrom(a,len,state.angle);const type=state.tool;let s=make(type,isTriangle(type)?triangleBuilt(pp[0],pp[1],type):pp);if(isTriangle(type)){const a=s.points[0],b=s.points[1],theta=Math.atan2(b.y-a.y,b.x-a.x)+(type==='rightTriangle'?90:type==='isoTriangle'?state.triAngle:state.triAngle)*Math.PI/180,l=type==='isoTriangle'?len:state.triSecond;s.points[2]={x:fmtNum(a.x+l*Math.cos(theta)),y:fmtNum(a.y+l*Math.sin(theta))}}if(type==='ellipse')s.minor=state.minor;if(type==='polygon')s.sides=state.sides;if(type==='text'){s.points=[pp[0]]}addItem(s);state.anchor=type==='continuous'?clone(pp[1]):null;updateCursor(pp[1]);updateTip();status(`${tools[type]}：${display(len)}，角度 ${state.angle}°`)}
function mutateSelected(prop,val){const s=current();if(!s)return;checkpoint();const p=s.points[Math.min(state.point,s.points.length-1)];const before=clone(s.points);const d=getDims(s);let n=Number(val);if(['px','py'].includes(prop)){p[prop==='px'?'x':'y']=fmtNum(toMM(n));fixNamedTriangle(s,state.point,before);updateCursor(p)}
else if(prop==='itemColor')s.stroke=val;else if(prop==='itemWidth')s.width=Math.max(.5,Math.min(30,n));
else if(prop==='itemFont')s.font=val;else if(prop==='itemFontSize')s.fontSize=Math.max(8,n);else if(prop==='itemBold')s.bold=val==='true';else if(prop==='itemText')s.text=val;
else if(prop==='itemLen'||prop==='itemAngle'){const a=s.points[0],b=s.points[1],ang=prop==='itemAngle'?n:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,len=prop==='itemLen'?toMM(n):distance(a,b);if(len<=0){undo.pop();toast('長度必須大於零');return}b.x=fmtNum(a.x+len*Math.cos(ang*Math.PI/180));b.y=fmtNum(a.y+len*Math.sin(ang*Math.PI/180))}
else if(prop==='radius'){if(toMM(n)<=0){undo.pop();toast('半徑必須大於零');return}const c=s.points[0],b=s.points[1],a=Math.atan2(b.y-c.y,b.x-c.x);b.x=fmtNum(c.x+toMM(n)*Math.cos(a));b.y=fmtNum(c.y+toMM(n)*Math.sin(a))}
else if(prop==='startAngle')s.angle=n;
else if(['major','minor','ellipseAngle','polygonEdge','polygonRadius','polygonAngle','polygonSides'].includes(prop)){const c=s.points[0],b=s.points[1],radius=distance(c,b),theta=Math.atan2(b.y-c.y,b.x-c.x);let nextR=radius,nextTheta=theta;if(prop==='minor')s.minor=Math.max(.5,toMM(n)/2);if(prop==='major')nextR=Math.max(.5,toMM(n)/2);if(prop==='ellipseAngle'||prop==='polygonAngle')nextTheta=n*Math.PI/180;if(prop==='polygonSides')s.sides=Math.max(5,Math.min(8,Math.round(n)));if(prop==='polygonRadius')nextR=Math.max(.5,toMM(n));if(prop==='polygonEdge')nextR=Math.max(.5,toMM(n))/(2*Math.sin(Math.PI/(s.sides||6)));b.x=fmtNum(c.x+nextR*Math.cos(nextTheta));b.y=fmtNum(c.y+nextR*Math.sin(nextTheta));}
else if(['triA','triB','triAngle'].includes(prop)){const [a,b,c]=s.points,angB=Math.atan2(b.y-a.y,b.x-a.x),angC=Math.atan2(c.y-a.y,c.x-a.x);if(prop==='triA'){const length=toMM(n);b.x=fmtNum(a.x+length*Math.cos(angB));b.y=fmtNum(a.y+length*Math.sin(angB));if(s.type==='isoTriangle'){c.x=fmtNum(a.x+length*Math.cos(angC));c.y=fmtNum(a.y+length*Math.sin(angC))}}if(prop==='triB'){const length=toMM(n);c.x=fmtNum(a.x+length*Math.cos(angC));c.y=fmtNum(a.y+length*Math.sin(angC));if(s.type==='isoTriangle'){b.x=fmtNum(a.x+length*Math.cos(angB));b.y=fmtNum(a.y+length*Math.sin(angB))}}if(prop==='triAngle'&&s.type!=='rightTriangle'){const dist=distance(a,c);c.x=fmtNum(a.x+dist*Math.cos(angB+n*Math.PI/180));c.y=fmtNum(a.y+dist*Math.sin(angB+n*Math.PI/180))}if(s.type==='rightTriangle')fixNamedTriangle(s,1,before)}
render();store()}
function chooseAndDrag(event){const handle=event.target.closest('[data-handle]');const node=event.target.closest('[data-id]');if(handle){const id=handle.dataset.id,i=Number(handle.dataset.handle);state.selected=id;state.point=i;return {kind:'handle',id,index:i,origin:screenToWorld(event),snapshot:snapshot(),moved:false}}
if(node){const id=node.dataset.id;state.selected=id;state.point=Math.max(0,Math.min(state.point,(current()?.points?.length||1)-1));return {kind:'move',id,origin:screenToWorld(event),snapshot:snapshot(),moved:false}}
state.selected=null;return {kind:'empty',origin:screenToWorld(event),moved:false}}
function onDown(e){if(e.button!=null&&e.button!==0)return;if(state.gesture)return;e.preventDefault();svg.setPointerCapture(e.pointerId);let p=screenToWorld(e);state.cursor=clone(p);updateCursor(p);if(state.tool==='select'){state.gesture=chooseAndDrag(e);render();return}
if(state.tool==='pan'){state.gesture={kind:'pan',origin:{x:e.clientX,y:e.clientY},cx:state.view.cx,cy:state.view.cy,moved:false};return}
if(state.tool==='text'){const s=make('text',[roundSnap(p)]);addItem(s);setTool('select');return}
state.gesture={kind:'draw',type:state.tool,start:roundSnap(p),current:roundSnap(p),origin:{x:e.clientX,y:e.clientY},moved:false,trail:[roundSnap(p)]};if(state.tool==='pen')state.preview=make('pen',[p]);drawOnly()}
function previewFor(g){const a=g.start,b=g.current,t=g.type;let points=[a,b];if(isTriangle(t))points=triangleBuilt(a,b,t);if(t==='continuous'){if(!state.anchor)return null;points=[clone(state.anchor),b]}
let s=make(t,points);if(t==='pen')s.points=g.trail;return s}
function onMove(e){const g=state.gesture;if(!g)return;e.preventDefault();if(g.kind==='pan'){const dx=(e.clientX-g.origin.x)/state.view.scale,dy=(e.clientY-g.origin.y)/state.view.scale;state.view.cx=g.cx-dx;state.view.cy=g.cy-dy;updateViewport();return}
const point=screenToWorld(e);updateCursor(point);if(g.kind==='draw'){g.current=(['line','continuous','dashed','arrow','dimension'].includes(g.type)?snapAnglePoint(g.type==='continuous'&&state.anchor?state.anchor:g.start,roundSnap(point)):roundSnap(point));if(Math.hypot(e.clientX-g.origin.x,e.clientY-g.origin.y)>5)g.moved=true;if(g.type==='pen')g.trail.push(point);state.preview=previewFor(g);drawOnly();return}
if(g.kind==='move'||g.kind==='handle'){const s=current();if(!s)return;const dx=point.x-g.origin.x,dy=point.y-g.origin.y;if(Math.abs(dx)+Math.abs(dy)>3/state.view.scale)g.moved=true;const original=JSON.parse(g.snapshot).items.find(x=>x.id===s.id);if(!original)return;s.points=clone(original.points);if(g.kind==='handle'){s.points[g.index]=roundSnap({x:original.points[g.index].x+dx,y:original.points[g.index].y+dy});fixNamedTriangle(s,g.index,original.points)}else{moveShape(s,dx,dy)}drawOnly()}}
function onUp(e){const g=state.gesture;if(!g)return;state.gesture=null;e.preventDefault();if(g.kind==='pan'){state.preview=null;drawOnly();return}
if(g.kind==='move'||g.kind==='handle'){if(g.moved){undo.push(g.snapshot);if(undo.length>80)undo.shift();redo.length=0;store()}render();return}
if(g.kind==='empty'){render();return}
if(g.kind!=='draw')return;const type=g.type,a=g.start,b=g.current;state.preview=null;
if(type==='pen'){if(g.trail.length>1){addItem(make('pen',g.trail))}else render();return}
if(type==='continuous'){if(!state.anchor){state.anchor=clone(a);state.pending=null;status('已設定連續線起點，可點下一點或選方向、輸入長度');render();return}if(distance(state.anchor,b)>1){const s=make('continuous',[clone(state.anchor),clone(b)]);addItem(s);state.anchor=clone(b);updateCursor(b)}else render();return}
if(g.moved){if(distance(a,b)<1){render();return}const s=make(type,isTriangle(type)?triangleBuilt(a,b,type):[a,b]);addItem(s);state.pending=null;return}
if(!state.pending||state.pending.type!==type){state.pending={type,start:clone(a)};status('已設定第一點，請點第二點完成');render();return}
const first=state.pending.start;state.pending=null;if(distance(first,b)<1){render();return}const s=make(type,isTriangle(type)?triangleBuilt(first,b,type):[first,b]);addItem(s)}
function del(){const s=current();if(!s)return;checkpoint();state.items=state.items.filter(x=>x.id!==s.id);state.selected=null;render();store();toast('已刪除')}
function duplicate(){const s=current();if(!s)return;let t=clone(s);t.id='s'+(++seq);t.points.forEach(p=>{p.x+=40;p.y+=40});addItem(t);toast('已複製圖層')}
function reorder(id,delta){let i=state.items.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=state.items.length)return;checkpoint();[state.items[i],state.items[j]]=[state.items[j],state.items[i]];render();store()}
function setDirection(e){const r=$('dial').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);state.angle=(Math.round((Math.atan2(dy,dx)*180/Math.PI+360)%360));renderInspector()}
function handleProp(key,value){if(['px','py','itemLen','itemAngle','radius','startAngle','triA','triB','triAngle','major','minor','ellipseAngle','polygonSides','polygonEdge','polygonRadius','polygonAngle','itemColor','itemWidth','itemFont','itemFontSize','itemBold','itemText'].includes(key)){if(current())mutateSelected(key,value);else if(key==='px'||key==='py'){state.cursor[key==='px'?'x':'y']=toMM(value);updateCursor(state.cursor);renderInspector()}return}
if(key==='bgOpacity'){if(state.bg){checkpoint();state.bg.opacity=Math.max(0,Math.min(1,Number(value)||0));$('background').innerHTML=drawBackground();store()}return}
if(key==='newMajor'){state.len=Math.max(.01,toMM(value)/2);return}if(key==='newMinor'){state.minor=Math.max(.01,toMM(value)/2);return}if(key==='newSides'){state.sides=Math.max(5,Math.min(8,Math.round(Number(value)||6)));renderInspector();return}if(key==='newPolyRadius'){state.len=Math.max(.01,toMM(value));renderInspector();return}if(key==='newPolyEdge'){state.len=Math.max(.01,toMM(value))/(2*Math.sin(Math.PI/state.sides));renderInspector();return}if(key==='newTriB'){state.triSecond=Math.max(.01,toMM(value));return}if(key==='newTriAngle'){state.triAngle=Math.max(1,Math.min(179,Number(value)||65));return}if(key==='len'){state.len=Math.max(.01,toMM(value));return}if(key==='angle'){state.angle=Number(value)||0;renderInspector();return}
if(key==='pen'){state.pen=value;const s=current();if(s){checkpoint();s.stroke=value;drawOnly();store()}return}
if(key==='width'){state.width=Math.max(.5,Math.min(30,Number(value)||2));const s=current();if(s){checkpoint();s.width=state.width;drawOnly();store()}return}
if(key==='font'){state.font=value;return}if(key==='fontSize'){state.fontSize=Number(value);return}if(key==='bold'){state.bold=value==='true';return}if(key==='text'){state.text=value;return}if(key==='step'){state.step=Number(value)||1;renderInspector()}}
function setBg(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{checkpoint();const width=2200,height=width*img.naturalHeight/img.naturalWidth;state.bg={src:reader.result,x:0,y:0,w:width,h:height,opacity:.65};state.view.cx=width/2;state.view.cy=height/2;fit();render();store();toast('照片已匯入為底圖')} ;img.src=reader.result};reader.readAsDataURL(file)}
function fit(){const box=state.items.flatMap(i=>i.points);if(state.bg)box.push({x:state.bg.x,y:state.bg.y},{x:state.bg.x+state.bg.w,y:state.bg.y+state.bg.h});if(box.length){const minX=Math.min(...box.map(p=>p.x)),maxX=Math.max(...box.map(p=>p.x)),minY=Math.min(...box.map(p=>p.y)),maxY=Math.max(...box.map(p=>p.y)),w=maxX-minX,h=maxY-minY;state.view.cx=(minX+maxX)/2;state.view.cy=(minY+maxY)/2;const rect=canvasSize();state.view.scale=Math.min(rect.w/Math.max(w+260,600),rect.h/Math.max(h+220,450),1.3)}else{state.view={cx:1200,cy:750,scale:Math.min(canvasSize().w/2800,canvasSize().h/1700)}}drawOnly()}
function zoom(f){state.view.scale=Math.min(3,Math.max(.035,state.view.scale*f));drawOnly()}
function bounds(){const box=state.items.filter(s=>s.visible!==false).flatMap(i=>i.points);if(state.bg)box.push({x:state.bg.x,y:state.bg.y},{x:state.bg.x+state.bg.w,y:state.bg.y+state.bg.h});if(!box.length)return {...lastView};let minX=Math.min(...box.map(p=>p.x)),maxX=Math.max(...box.map(p=>p.x)),minY=Math.min(...box.map(p=>p.y)),maxY=Math.max(...box.map(p=>p.y));const pad=Math.max(90,(Math.max(maxX-minX,maxY-minY))*.06);return {x:minX-pad,y:minY-pad,w:Math.max(400,maxX-minX+2*pad),h:Math.max(280,maxY-minY+2*pad)}}
function svgExportString(){const b=bounds();const valid=state.items.filter(s=>s.visible!==false);const arrow=`<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a65c45"/></marker></defs>`;return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(b.w)}" height="${Math.ceil(b.h)}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}">${arrow}<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="#fffefb"/>${drawBackground()}${valid.map(s=>renderShape(s,{hit:false})).join('')}</svg>`}
function download(blob,filename){const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),2000)}
const safeName=()=>($('filename').value.trim()||'三川圖面').replace(/[\\/:*?"<>|]/g,'_');
function saveJson(){state.project=$('filename').value.trim()||'未命名圖面';const data={format:'sanchuan-markup',version:1,unit:state.unit,project:state.project,items:state.items,bg:state.bg};download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),safeName()+'.json');store();toast('已儲存可編輯 JSON')}
function svgExport(){download(new Blob([svgExportString()],{type:'image/svg+xml;charset=utf-8'}),safeName()+'.svg');toast('已輸出 SVG')}
function toPng(){return new Promise((res,rej)=>{const text=svgExportString(),obj=URL.createObjectURL(new Blob([text],{type:'image/svg+xml;charset=utf-8'})),img=new Image();img.onload=()=>{const b=bounds(),scale=Math.min(3,1800/Math.max(1,b.w),1600/Math.max(1,b.h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.w*scale));c.height=Math.max(1,Math.round(b.h*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fffefb';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(obj);c.toBlob(blob=>blob?res(blob):rej(Error('PNG 產生失敗')),'image/png')};img.onerror=()=>{URL.revokeObjectURL(obj);rej(Error('圖片格式錯誤'))};img.src=obj})}
async function pngExport(){try{download(await toPng(),safeName()+'.png');toast('已輸出 PNG')}catch(e){toast('PNG 匯出失敗：'+e.message)}}
async function share(){try{const blob=await toPng(),file=new File([blob],safeName()+'.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({title:safeName(),files:[file]});status('已呼叫 iPhone 分享選單')}else{download(blob,file.name);toast('此瀏覽器不支援檔案分享，已下載 PNG')}}catch(e){if(e.name!=='AbortError')toast('無法分享：'+e.message)}}
function importJson(file){if(!file)return;file.text().then(s=>{const data=JSON.parse(s);if(!Array.isArray(data.items))throw Error('非圖面 JSON');checkpoint();state.items=data.items.filter(o=>o&&typeof o.id==='string'&&Array.isArray(o.points));state.bg=data.bg||null;state.project=data.project||'匯入圖面';if(MM[data.unit])state.unit=data.unit;$('filename').value=state.project;state.selected=null;fit();render();store();toast('圖面已載入')}).catch(e=>toast('JSON 載入失敗：'+e.message))}
// App click delegation
$('tools').addEventListener('click',e=>{const m=e.target.closest('[data-menu]');if(m){pickCategory(m.dataset.menu);return}const t=e.target.closest('[data-tool]');if(t)setTool(t.dataset.tool)});
$('toolPicker').addEventListener('click',e=>{if(e.target.closest('[data-close-menu]')){closeMenus();return}const b=e.target.closest('[data-pick-tool]');if(b){if(b.dataset.pickSides)state.sides=Number(b.dataset.pickSides);setTool(b.dataset.pickTool);toast('已選擇 '+(b.textContent||''))}});
$('pointNudge').addEventListener('click',e=>{const step=e.target.closest('[data-cycle-step]');if(step){e.preventDefault();const all=[1,5,10,50];state.step=all[(all.indexOf(state.step)+1)%all.length];render();return}const b=e.target.closest('[data-float-nudge]');if(b){e.preventDefault();nudge(b.dataset.floatNudge)}});
$('openColor').onclick=()=>openQuick('color');$('openWidth').onclick=()=>openQuick('width');$('openUnit').onclick=()=>openQuick('unit');
$('quickPanel').addEventListener('click',e=>{if(e.target.closest('[data-close-quick]')){closeMenus();return}const b=e.target.closest('[data-quick-unit]');if(b){state.unit=b.dataset.quickUnit;syncQuick();render();closeMenus()}});
$('quickPanel').addEventListener('input',e=>{if(e.target.id==='quickColor')handleProp('pen',e.target.value);if(e.target.id==='quickWidth'||e.target.id==='quickWidthNum'){handleProp('width',e.target.value);const sib=e.target.id==='quickWidth'?'quickWidthNum':'quickWidth';if($(sib))$(sib).value=state.width}syncQuick()});
$('guideH').onclick=()=>{state.guideH=!state.guideH;syncQuick();drawOnly()};$('guideV').onclick=()=>{state.guideV=!state.guideV;syncQuick();drawOnly()};$('angleSnap').onclick=()=>{state.angleSnap=!state.angleSnap;syncQuick();drawOnly()};
$('inspector').addEventListener('click',e=>{const b=e.target.closest('button');if(!b){const row=e.target.closest('[data-layer]');if(row){state.selected=row.dataset.layer;state.point=0;render()}return}if(b.dataset.unit){state.unit=b.dataset.unit;render();return}if(b.dataset.point!=null){setPoint(Number(b.dataset.point));return}if(b.dataset.nudge){nudge(b.dataset.nudge);return}if(b.dataset.dir){addByNumber(b.dataset.dir);return}if(b.dataset.layerVisible){const o=state.items.find(x=>x.id===b.dataset.layerVisible);if(o){checkpoint();o.visible=o.visible===false;render();store()}return}if(b.dataset.layerUp){reorder(b.dataset.layerUp,1);return}if(b.dataset.layerDown){reorder(b.dataset.layerDown,-1);return}if(b.dataset.layer){state.selected=b.dataset.layer;state.point=0;render();return}
const row=b.closest('[data-layer]');if(row){state.selected=row.dataset.layer;state.point=0;render();return}
const id=b.id;if(id==='addByNumber')addByNumber();if(id==='deleteSel')del();if(id==='duplicate')duplicate();if(id==='layerUp'&&current())reorder(current().id,1);if(id==='clear'){if(state.items.length&&confirm('確定清空所有圖形？此操作可以復原。')){checkpoint();state.items=[];state.selected=null;state.anchor=null;render();store()}}if(id==='removeBg'&&state.bg){checkpoint();state.bg=null;render();store()}if(id==='shareSide')share();if(id==='png')pngExport();if(id==='svgExport')svgExport();if(id==='jsonExport')saveJson();if(id==='jsonImport')$('importInput').click()});
$('inspector').addEventListener('change',e=>{const key=e.target.dataset.prop;if(key)handleProp(key,e.target.value)});
$('inspector').addEventListener('pointerdown',e=>{if(e.target.closest('#dial')){e.preventDefault();setDirection(e)}},{passive:false});
svg.addEventListener('pointerdown',onDown);svg.addEventListener('pointermove',onMove);svg.addEventListener('pointerup',onUp);svg.addEventListener('pointercancel',e=>{state.gesture=null;state.preview=null;render()});
$('undo').onclick=undoIt;$('redo').onclick=redoIt;$('fit').onclick=fit;$('delete').onclick=del;$('endCont').onclick=()=>{state.anchor=null;state.pending=null;render();toast('連續線已結束')};
$('grid').onclick=()=>{state.grid=!state.grid;$('grid').textContent=state.grid?'格線 ✓':'格線';$('grid').classList.toggle('active',state.grid);drawOnly()};
$('snap').onclick=()=>{state.snap=!state.snap;$('snap').textContent=state.snap?'吸附 10mm ✓':'不吸附';$('snap').classList.toggle('active',state.snap)};
$('zoomIn').onclick=()=>zoom(1.25);$('zoomOut').onclick=()=>zoom(.8);
$('focus').onclick=()=>{closeMenus();$('app').classList.toggle('focus');$('focus').textContent=$('app').classList.contains('focus')?'↩ 返回':'⛶ 滿版';setTimeout(drawOnly,0)};
$('toggleSide').onclick=()=>{closeMenus();if($('app').classList.contains('focus')){$('app').classList.remove('focus');$('focus').textContent='⛶ 滿版'}const s=$('side');s.classList.toggle('closed');state.side=!s.classList.contains('closed');setTimeout(drawOnly,0)};
$('bgBtn').onclick=()=>$('bgInput').click();$('bgInput').onchange=e=>{setBg(e.target.files[0]);e.target.value=''};$('importInput').onchange=e=>{importJson(e.target.files[0]);e.target.value=''};
$('share').onclick=share;
$('exportMenu').onclick=()=>{closeMenus();const s=$('side');if($('app').classList.contains('focus')){$('app').classList.remove('focus');$('focus').textContent='⛶ 滿版'}s.classList.remove('closed');renderInspector();s.scrollTop=s.scrollHeight;setTimeout(drawOnly,0)};
$('filename').addEventListener('change',()=>{state.project=$('filename').value;store()});
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redoIt():undoIt()}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del()}else if(e.key==='Escape'){closeMenus();$('side').classList.add('closed');state.anchor=null;state.pending=null;state.selected=null;render()}});
const resize=()=>{document.documentElement.style.setProperty('--real-height',(window.visualViewport?.height||window.innerHeight)+'px');drawOnly()};window.addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);
// Prevent two-finger Safari page zoom and add zoom-on-pinch directly to the SVG.
let pinch=null;svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),scale:state.view.scale};state.gesture=null;state.preview=null}},{passive:true});svg.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();const a=e.touches[0],b=e.touches[1];state.view.scale=Math.max(.035,Math.min(3,pinch.scale*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/Math.max(1,pinch.d)));drawOnly()}},{passive:false});svg.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null});
readStored();resize();fit();render();

window.__SC_TEST={get:()=>({items:clone(state.items),tool:state.tool,selected:state.selected,anchor:clone(state.anchor),unit:state.unit}),setTool,addByNumber,undo:undoIt,redo:redoIt,render,svgExportString};
})();
