#app > .numeric-panel .numeric-fixed .numeric-field-angle input{width:49px}
@media(max-width:650px){#app > .numeric-panel .numeric-fixed{gap:3px}
 #app > .numeric-panel .numeric-fixed .numeric-field{font-size:10px;gap:2px}
 #app > .numeric-panel .numeric-fixed .numeric-field input{width:54px;height:32px;font-size:14px}
 #app > .numeric-panel .numeric-fixed .numeric-field-angle input{width:39px}}

#app > .numeric-panel .numeric-primary {min-width:54px;height:36px}
#app > .numeric-panel .numeric-close {height:36px}
#app > .numeric-panel .numeric-angle-dial {position:absolute;top:calc(100% + 3px);bottom:auto;left:50%;right:auto;transform:translateX(-50%);z-index:65;}
#app > .numeric-panel.collapsed {width:100% !important;min-height:36px}
#app > .numeric-panel.collapsed .numeric-strip{height:36px;min-height:36px;justify-content:flex-start;}
#app > .numeric-panel.collapsed .numeric-small{height:29px}
#app > .numeric-panel.collapsed .numeric-fixed{display:none}
/* Settings are directly under the file bar; draw tools stay anchored to bottom. */
#app > .settings-top-bar {
  display:flex;align-items:center;gap:3px;flex:0 0 auto;
  height:52px;min-height:52px;min-width:0;width:100%;
  background:#eaf1ee;border-bottom:1px solid #a3b8b0;
  padding:2px max(4px,env(safe-area-inset-right)) 2px max(4px,env(safe-area-inset-left));
  z-index:38;
}
#app .settings-top-bar .setting-tools{
  display:flex;flex:1;min-width:0;align-items:center;gap:4px;white-space:nowrap;
  padding:0 4px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
#app .settings-top-bar .setting-tools::-webkit-scrollbar{display:none}
#app .settings-top-bar .tool{
  display:flex;flex:none;align-items:center;justify-content:center;flex-direction:column;
  min-width:55px;width:55px;height:44px;min-height:44px;gap:1px;padding:2px 3px;
  border-radius:7px;border:1px solid #c4d6d0;color:#365954;background:#f9fcfa;font-size:10px;
}
#app .settings-top-bar .tool .ic{font-size:17px;line-height:1}
#app .settings-top-bar .tool.sel{border-color:#38877b;background:#d1e9e1;color:#14594e;font-weight:700}
#app .top-strip-caption{font-size:11px;font-weight:800;white-space:nowrap;color:#54736c;padding-left:5px}
#app .top-strip-close{width:28px;height:30px;flex:none;border:1px solid #a8bcb4;background:#fafbf9;border-radius:7px;font-size:19px;color:#375952}
/* No forced overlay during numeric keyboard input. The app's visual-viewport height shrinks,
   and the numeric row remains above the canvas even while typing. */
body.numeric-keyboard #app > .numeric-panel {display:block !important;top:auto !important;bottom:auto !important;}
body.numeric-keyboard #app > .settings-top-bar{display:none !important}
body.numeric-keyboard #app .main{min-height:0;flex:1}
@media(max-height:440px){
 #app > .numeric-panel .numeric-strip{height:43px;min-height:43px;padding-top:2px;padding-bottom:2px}
 #app > .settings-top-bar{height:45px;min-height:45px}
 #app .settings-top-bar .tool{height:39px;min-height:39px}
}

<body>
<div id="app">

            <span></span><button data-cursor-dir="down">↓</button><span></span>
          </div><button id="cursorConfirm" class="cursor-confirm">◎ 準星選取</button>
        </div>
<div class="hud"><div class="coords" id="coords">X 0　Y 0 mm</div><div class="zoom"><button id="zoomOut">−</button><span id="zoomText">100%</span><button id="zoomIn">＋</button></div></div><div id="toast"></div>

</div>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), svg=$('sheet');
const MM={mm:1,cm:10,chi:303}, names={mm:'公釐',cm:'公分',chi:'台尺'};
const tools={numeric:'數值畫線',select:'選取',pan:'平移',line:'直線',continuous:'連續線',dashed:'虛線',arrow:'箭頭',dimension:'尺寸線',circle:'圓形',semi:'半圓',quarter:'四分之一圓',ellipse:'橢圓',triangle:'一般三角形',rightTriangle:'直角三角形',isoTriangle:'等腰三角形',polygon:'正多角形',pen:'畫筆',text:'文字'};
const categories={lines:[['line','直線'],['continuous','連續直線'],['numeric','數值畫線'],['dashed','虛線'],['arrow','箭頭'],['dimension','尺寸標記']],curves:[['circle','圓形'],['semi','半圓'],['quarter','四分之一圓'],['ellipse','橢圓']],triangles:[['triangle','一般三角形'],['rightTriangle','直角三角形'],['isoTriangle','等腰三角形']],polygons:[['polygon','正五角形',5],['polygon','正六角形',6],['polygon','正七角形',7],['polygon','正八角形',8]]};
const groupNames={lines:'線條種類',curves:'圓形與橢圓',triangles:'三角形',polygons:'正多角形'};
const toolHomeMarkup=$('tools').innerHTML;
let toolTab='draw';
function shapeIcon(tool,n){
 const icons={numeric:'<path d="M3 19H23 M3 15v8 M23 15v8 M8 7h12 M13 4l-3 3 3 3"/>',line:'<path d="M5 23L23 5"/>',continuous:'<path d="M3 21 L12 12 L23 20"/>',dashed:'<path d="M3 22L7 18 M10 15L14 11 M17 8L21 4"/>',arrow:'<path d="M4 23L23 4M15 4H23V12"/>',dimension:'<path d="M4 5V22 M24 5V22 M4 14H24 M8 10L4 14L8 18 M20 10L24 14L20 18"/>',circle:'<circle cx="14" cy="14" r="10"/>',semi:'<path d="M4 23 A10 10 0 0 1 24 23 M4 23 H24"/>',quarter:'<path d="M5 23L5 6 A17 17 0 0 1 22 23 Z"/>',ellipse:'<ellipse cx="14" cy="14" rx="11" ry="6"/>',triangle:'<path d="M3 24L14 4L25 24Z"/>',rightTriangle:'<path d="M4 4V24H24Z M4 19H9V24"/>',isoTriangle:'<path d="M14 4L3 24H25Z M8 13l3 2 M20 13l-3 2"/>',polygon:''};
 let body=icons[tool]||'';
 if(tool==='polygon'){let sides=n||6;const ps=Array.from({length:sides},(_,i)=>{const a=-Math.PI/2+i*Math.PI*2/sides;return `${(14+11*Math.cos(a)).toFixed(1)},${(14+11*Math.sin(a)).toFixed(1)}`}).join(' ');body=`<polygon points="${ps}"/>`}
 return `<span class="shape-glyph"><svg viewBox="0 0 28 28" aria-hidden="true">${body}</svg></span>`;
}
function syncDock(){
 $('drawingTab').classList.toggle('active',toolTab==='draw');$('settingsTab').classList.toggle('active',toolTab==='settings');
 $('drawingTab').setAttribute('aria-selected',String(toolTab==='draw'));$('settingsTab').setAttribute('aria-selected',String(toolTab==='settings'));
 $('tools').classList.remove('hidden');$('settingsTopBar').classList.toggle('hidden',toolTab!=='settings');$('settingsTools').classList.remove('hidden');
 $('unitCycleLabel').textContent=names[state.unit];
 $('settingsTools').querySelectorAll('[data-dock-setting]').forEach(b=>{const yes=!!state[b.dataset.dockSetting];b.classList.toggle('sel',yes);b.setAttribute('aria-pressed',String(yes))});
 $('selectAction').classList.toggle('on',state.tool==='select'&&!$('cursorPad').classList.contains('hidden'));syncNumeric();
}
function restoreDrawingTools(){if($('tools').innerHTML!==toolHomeMarkup)$('tools').innerHTML=toolHomeMarkup;activeMenu=null;syncToolbarActive()}
function syncToolbarActive(){document.querySelectorAll('[data-tool]').forEach(el=>el.classList.toggle('active',el.dataset.tool===state.tool));document.querySelectorAll('[data-menu]').forEach(el=>el.classList.toggle('active',!!categories[el.dataset.menu]?.some(row=>row[0]===state.tool&&(state.tool!=='polygon'||Number(row[2])===state.sides))))}
function selectDrawingTab(tab){toolTab=(tab==='settings'&&toolTab==='settings')?'draw':tab;if(toolTab==='settings')restoreDrawingTools();closeMenus();syncDock();syncNumeric();requestAnimationFrame(drawOnly)}
function placeCursorOverlay(){const el=$('precisionCrosshair');if($('cursorPad').classList.contains('hidden')||state.tool!=='select'){el.classList.add('hidden');return}const c=canvasSize(),x=(state.cursor.x-lastView.x)/lastView.w*c.w,y=(state.cursor.y-lastView.y)/lastView.h*c.h;el.style.left=x+'px';el.style.top=y+'px';el.classList.toggle('hidden',x<-30||x>c.w+30||y<-30||y>c.h+30);$('cursorStep').textContent=state.step+' mm'}

function fixNamedTriangle(s,index,old){
 if(!['rightTriangle','isoTriangle'].includes(s.type)||!old||old.length<3)return;
 const [a,b,c]=s.points;
 if(index===0){const dx=a.x-old[0].x,dy=a.y-old[0].y;for(let k=1;k<3;k++){s.points[k].x=fmtNum(old[k].x+dx);s.points[k].y=fmtNum(old[k].y+dy)}return}

 if(s.type==='rightTriangle'){
   const ori=(old[1].x-old[0].x)*(old[2].y-old[0].y)-(old[1].y-old[0].y)*(old[2].x-old[0].x);
   const side=ori<0?-1:1,length=index===2?Math.max(1,distance(a,c)):Math.max(1,distance(old[0],old[2]));
   const rad=angleAB+side*Math.PI/2;c.x=fmtNum(a.x+length*Math.cos(rad));c.y=fmtNum(a.y+length*Math.sin(rad));
 } else {
   if(index===1){const len=Math.max(1,distance(a,b)),rad=Math.atan2(old[2].y-a.y,old[2].x-a.x);c.x=fmtNum(a.x+len*Math.cos(rad));c.y=fmtNum(a.y+len*Math.sin(rad))}
   else {const len=Math.max(1,distance(a,c)),rad=Math.atan2(old[1].y-a.y,old[1].x-a.x);b.x=fmtNum(a.x+len*Math.cos(rad));b.y=fmtNum(a.y+len*Math.sin(rad))}
 }
}
function moveShape(s,dx,dy){s.points.forEach(p=>{p.x=fmtNum(p.x+dx);p.y=fmtNum(p.y+dy)})}
function lineFrom(anchor,len,angle){const rad=angle*Math.PI/180;return [{...anchor},{x:fmtNum(anchor.x+len*Math.cos(rad)),y:fmtNum(anchor.y+len*Math.sin(rad))}]}
function numericOriginFromContext(){

 $('numericOrigin').textContent=`起點 X ${toUnit((numeric.anchor||numericOriginFromContext()).x)} / Y ${toUnit((numeric.anchor||numericOriginFromContext()).y)} ${names[state.unit]}`;
 root.querySelectorAll('[data-numeric-dir]').forEach(btn=>{const yes=btn.dataset.numericDir===numeric.direction;btn.classList.toggle('active',yes);btn.setAttribute('aria-pressed',String(yes))});
 const ray=$('numericDialRay'),rad=numeric.angle*Math.PI/180;ray.setAttribute('x2',60+42*Math.cos(rad));ray.setAttribute('y2',60+42*Math.sin(rad));

function numericDirection(angle){const a=((Number(angle)%360)+360)%360;return (Math.abs(a)<.00001||Math.abs(a-360)<.00001)?'right':Math.abs(a-90)<.00001?'down':Math.abs(a-180)<.00001?'left':Math.abs(a-270)<.00001?'up':'custom'}

function numericCommit(){
 if(!numericSetLength($('numericLength').value))return false;
 const a=Number($('numericAngle').value);if(!Number.isFinite(a)){toast('角度格式錯誤');return false}
 numeric.angle=a;numeric.direction=numericDirection(a);
 const p=numeric.anchor||numericOriginFromContext();const next=lineFrom(p,numeric.lengthMM,numeric.angle);
 const item=make('line',next);addItem(item);
 updateCursor(next[1]);if(numeric.continuous)numeric.anchor=clone(next[1]);
 else numeric.anchor=clone(p);

}
function addByNumber(dir){if(state.tool==='numeric'){numericCommit();return}if(dir){state.angle=({right:0,down:90,left:180,up:270})[dir]}const len=Math.max(.001,state.len);let a=state.tool==='continuous'?state.anchor:null;
if(!a){const selected=current();a=selected?.points?.[Math.min(state.point,selected.points.length-1)]||state.cursor}
const pp=lineFrom(a,len,state.angle);const type=state.tool;let s=make(type,isTriangle(type)?triangleBuilt(pp[0],pp[1],type):pp);if(isTriangle(type)){const a=s.points[0],b=s.points[1],theta=Math.atan2(b.y-a.y,b.x-a.x)+(type==='rightTriangle'?90:type==='isoTriangle'?state.triAngle:state.triAngle)*Math.PI/180,l=type==='isoTriangle'?len:state.triSecond;s.points[2]={x:fmtNum(a.x+l*Math.cos(theta)),y:fmtNum(a.y+l*Math.sin(theta))}}if(type==='ellipse')s.minor=state.minor;if(type==='polygon')s.sides=state.sides;if(type==='text'){s.points=[pp[0]]}addItem(s);state.anchor=type==='continuous'?clone(pp[1]):null;updateCursor(pp[1]);updateTip();status(`${tools[type]}：${display(len)}，角度 ${state.angle}°`)}

else if(prop==='itemColor')s.stroke=val;else if(prop==='itemWidth')s.width=Math.max(.5,Math.min(30,n));
else if(prop==='itemFont')s.font=val;else if(prop==='itemFontSize')s.fontSize=Math.max(8,n);else if(prop==='itemBold')s.bold=val==='true';else if(prop==='itemText')s.text=val;
else if(prop==='itemLen'||prop==='itemAngle'){const a=s.points[0],b=s.points[1],ang=prop==='itemAngle'?n:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,len=prop==='itemLen'?toMM(n):distance(a,b);if(len<=0){undo.pop();toast('長度必須大於零');return}b.x=fmtNum(a.x+len*Math.cos(ang*Math.PI/180));b.y=fmtNum(a.y+len*Math.sin(ang*Math.PI/180))}
else if(prop==='radius'){if(toMM(n)<=0){undo.pop();toast('半徑必須大於零');return}const c=s.points[0],b=s.points[1],a=Math.atan2(b.y-c.y,b.x-c.x);b.x=fmtNum(c.x+toMM(n)*Math.cos(a));b.y=fmtNum(c.y+toMM(n)*Math.sin(a))}

else if(['major','minor','ellipseAngle','polygonEdge','polygonRadius','polygonAngle','polygonSides'].includes(prop)){const c=s.points[0],b=s.points[1],radius=distance(c,b),theta=Math.atan2(b.y-c.y,b.x-c.x);let nextR=radius,nextTheta=theta;if(prop==='minor')s.minor=Math.max(.5,toMM(n)/2);if(prop==='major')nextR=Math.max(.5,toMM(n)/2);if(prop==='ellipseAngle'||prop==='polygonAngle')nextTheta=n*Math.PI/180;if(prop==='polygonSides')s.sides=Math.max(5,Math.min(8,Math.round(n)));if(prop==='polygonRadius')nextR=Math.max(.5,toMM(n));if(prop==='polygonEdge')nextR=Math.max(.5,toMM(n))/(2*Math.sin(Math.PI/(s.sides||6)));b.x=fmtNum(c.x+nextR*Math.cos(nextTheta));b.y=fmtNum(c.y+nextR*Math.sin(nextTheta));}

state.gesture={kind:'draw',type:state.tool,start:roundSnap(p),current:roundSnap(p),origin:{x:e.clientX,y:e.clientY},moved:false,trail:[roundSnap(p)]};if(state.tool==='pen')state.preview=make('pen',[p]);drawOnly()}

 if(Math.abs(dx)+Math.abs(dy)>3/state.view.scale)g.moved=true;
 if(g.kind==='bg-move'){state.bg.x=fmtNum(original.x+dx);state.bg.y=fmtNum(original.y+dy)}
 else{const corners=[[original.x,original.y],[original.x+original.w,original.y],[original.x+original.w,original.y+original.h],[original.x,original.y+original.h]];
 const opposite=corners[(g.index+2)%4],signX=[-1,1,1,-1][g.index],signY=[-1,-1,1,1][g.index];

 state.bg.w=fmtNum(w);state.bg.h=fmtNum(h);state.bg.x=fmtNum(signX===1?opposite[0]:opposite[0]-w);state.bg.y=fmtNum(signY===1?opposite[1]:opposite[1]-h)}

}
